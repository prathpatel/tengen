name: tengen
description: Tengen, an open source mobile app to play Go on online-go.com and offline.
publish_to: "none"

version: 0.4.0+11

environment:
  sdk: ^3.14.0
  flutter: 3.50.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  material_ui: ^1.10.0
  meta: ^1.19.0
  shared_preferences: ^2.5.6
  web_socket_channel: ^3.0.3

dev_dependencies:
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter
  lint: ^2.14.0
  stream_channel: ^2.1.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - assets/learning_hub/learning_hub.json

# App icons: run `dart run flutter_launcher_icons` after changing assets/icon/.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#F0D5A8"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  # The artwork is already padded; 8% more keeps its corners inside the circular safe zone
  # (the default 16% makes the board needlessly small).
  adaptive_icon_foreground_inset: 8
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#F0D5A8"
    theme_color: "#8A5A2B"
