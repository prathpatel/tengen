name: tengen
description: Tengen, an open source mobile app to play Go on online-go.com and offline.
publish_to: "none"

version: 0.2.0+6

environment:
  sdk: ^3.14.0
  flutter: 3.50.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  material_ui: ^1.10.0
  meta: ^1.19.0
  shared_preferences: ^2.5.6
  web_socket_channel: ^3.0.3

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  lint: ^2.14.0
  stream_channel: ^2.1.4

flutter:
  uses-material-design: true
