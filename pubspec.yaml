name: tengen
description: Tengen, an open source mobile app to play Go on online-go.com and offline.
publish_to: "none"

version: 0.9.2+30

environment:
  sdk: ^3.14.0
  flutter: 3.50.0

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  material_ui: ^1.10.0
  meta: ^1.19.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  web_socket_channel: ^3.0.3

dev_dependencies:
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter
  lint: ^2.14.0
  stream_channel: ^2.1.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - assets/learning_hub/learning_hub.json
    - assets/goban/boards/
    - assets/goban/stones/
    - assets/sounds/stones/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/inter/Inter-Regular.ttf
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/inter/Inter-ExtraBold.ttf
          weight: 800

# App icons, wired as in github.com/prathpatel/GoGame (same artwork, same files):
# - Android: the adaptive icon is vector drawables (res/drawable/ic_launcher_background.xml, a
#   kaya gradient, and ic_launcher_foreground.xml, also the monochrome layer for themed icons),
#   referenced by res/mipmap-anydpi-v26/ic_launcher.xml and ic_launcher_round.xml, with PNGs in
#   res/mipmap-*dpi/ for Android 7 and older. `android: false` below keeps
#   `dart run flutter_launcher_icons` away from them: it would replace the vectors with a flat
#   background and a PNG. test/android_icon_test.dart checks they stay. For a new Android icon,
#   edit the vectors, or set `android: "ic_launcher"` for one run with the new artwork.
# - iOS and web: PNGs made from assets/icon/ by `dart run flutter_launcher_icons`. It also sets an
#   invalid value in ios/Runner.xcodeproj/project.pbxproj: `git checkout` that file afterwards.
# - tool/gen_icon.py renders assets/icon/*.png from the vector drawables.
flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#F0D5A8"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#F0D5A8"
    theme_color: "#8A5A2B"
